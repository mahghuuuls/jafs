apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'BlameJared'
                url 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'CraftTweaker2'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // Agent Diagnostics Toolkit, development runtime only; never packaged or declared.
    // The jar is not committed. Place it in libs/ before runClient or runServer:
    //   agenttesttoolkit-1.6.0.jar, 515225 bytes
    //   sha256 dc23d8c23f03eec18417cca99c870d3af75e8d29c3ebd4ca45c57b9dba44789c
    if (file('libs/agenttesttoolkit-1.6.0.jar').exists()) {
        runtimeOnly rfg.deobf(files('libs/agenttesttoolkit-1.6.0.jar'))
    }

    // Inhibited, development runtime only for the recovery-blocking checks; never packaged or declared
    // (JAFS finds the effect by registry id inhibited:inhibited at runtime):
    //   Inhibited-1.2.0.jar, sha256 f330fda62706a8237d9b5e86fc1e953e2ec3c4e752345a629a6ce75c7b0e45c7
    if (file('libs/Inhibited-1.2.0.jar').exists()) {
        runtimeOnly rfg.deobf(files('libs/Inhibited-1.2.0.jar'))
    }

    // Potion Core, development runtime only for the optional attribute properties; never packaged or declared
    // (JAFS finds its attributes by name at runtime and registers the properties only when the mod is loaded):
    //   PotionCore-1.9_for_1.12.2.jar, 145329 bytes, sha256 0851c95e297efffc18539212b826e3b935e9fc189363d9e311df4bb6d62e27dd
    if (file('libs/PotionCore-1.9_for_1.12.2.jar').exists()) {
        runtimeOnly rfg.deobf(files('libs/PotionCore-1.9_for_1.12.2.jar'))
    }

    // Setworks, whose API the compat package compiles against; development only, never packaged or shipped
    // (JAFS declares after:setworks and loads the compat class only when the mod is present):
    //   setworks-1.1.0-dev.jar (the deobfuscated development jar of Setworks 1.1.0), 501306 bytes,
    //   sha256 881585e4cb6bf7a21edcd9b54e451fe7c2481a27da24e4acda27e7820eb26688
    // Unlike the two runtime-only jars above, this one is needed to compile: the build stops with a clear message without it.
    // The effect kind uses only the API that Setworks 1.0.0 already had, so 1.0.0 stays supported.
    if (!file('libs/setworks-1.1.0-dev.jar').exists()) {
        throw new GradleException("libs/setworks-1.1.0-dev.jar is missing: copy the Setworks 1.1.0 development jar (build/libs of the Setworks project) into libs/; the compat package compiles against its API")
    }
    compileOnly rfg.deobf(files('libs/setworks-1.1.0-dev.jar'))
    runtimeOnly rfg.deobf(files('libs/setworks-1.1.0-dev.jar'))
    testCompileOnly rfg.deobf(files('libs/setworks-1.1.0-dev.jar'))
    testRuntimeOnly rfg.deobf(files('libs/setworks-1.1.0-dev.jar'))

    // Statusworks, whose API the compat package compiles against; development only, never packaged or shipped
    // (JAFS declares after:statusworks and loads the compat bridge only when the mod is present; the bridge checks for
    // 1.2.0 or newer before registering, which is safe because the API it links to is the same in 1.0.0, 1.1.0, and 1.2.0):
    //   statusworks-1.2.0-dev.jar (the deobfuscated development jar of Statusworks 1.2.0), 486368 bytes,
    //   sha256 b44fe6ba80f01289bf6a24523172259057eb526e0bff5a01825fa74785ea8877
    if (!file('libs/statusworks-1.2.0-dev.jar').exists()) {
        throw new GradleException("libs/statusworks-1.2.0-dev.jar is missing: copy the Statusworks 1.2.0 development jar (build/libs of the Statusworks project) into libs/; the compat package compiles against its API")
    }
    compileOnly rfg.deobf(files('libs/statusworks-1.2.0-dev.jar'))
    runtimeOnly rfg.deobf(files('libs/statusworks-1.2.0-dev.jar'))
    testCompileOnly rfg.deobf(files('libs/statusworks-1.2.0-dev.jar'))
    testRuntimeOnly rfg.deobf(files('libs/statusworks-1.2.0-dev.jar'))

    // CraftTweaker 4.1.20.718, development runtime only, for the Setworks and Statusworks test scripts; never packaged
    // or declared. Its author's Maven build (SRG-named; it loads in the development runtime, as in the Statusworks
    // project) with its two library parts, ZenScript and CraftTweaker2-API, brought along by the pom; declared without
    // rfg.deobf(). The CurseForge jar cannot go through rfg.deobf: it holds META-INF/crafttweaker_at.cfg and two FML
    // cache files twice, and the rewrite stops there. A fresh machine needs network access for this one download.
    runtimeOnly 'CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.718'

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - Shading dependencies:
    // Using the shadow plugin, by using the "shade" configuration, the dependency will be shaded into your output jar
    // shade 'mezz:jei:4.31.2' << will shade HadEnoughItems 4.31.2 directly into your jar
    // For more configuration options: see the bottom of this file and: https://gradleup.com/shadow/configuration/

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // shade = includes dependency in output

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}

// Need reobfJar to use uber jars, so dependencies that are shaded in are present
// Only redirect reobfJar through shadowJar when there's actually something to shade
if (!configurations.shade.dependencies.empty) {
    tasks.named('reobfJar').configure {
        inputJar.set(tasks.named('shadowJar').flatMap({ it.archiveFile }))
    }
}

// By default, it will use a "uberdev" suffix, and only pack shade configuration dependencies
// Uberdev: dev jar w/ dependencies, NOT a reobfuscated artifact!
// The end result (reobfJar) will have a non-suffixed name, as unlike normal shading envs, reobfJar is the end task
tasks.shadowJar {
    // Shadow wires shadowJar into the assemble task, so it runs even when nothing is shaded
    enabled = !project.configurations.shade.dependencies.empty
    archiveClassifier = 'uberdev'
    configurations = [ project.configurations.shade ]
}
